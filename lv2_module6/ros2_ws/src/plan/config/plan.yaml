    # 안 들어갈 구역 사각형 [x0, y0, x1, y1, …] (arena, m · 11-15 사용자 지정) — /arena/walls에 칸 100으로 채워 Nav2 전역·local이 피함
    #   · 다가설 자리가 이 안이면 그 변은 뺌. 위 띠(안쪽 벽 끝 x 4.044 ~ 바깥 벽) ·
    #   왼쪽 아래 띠(벽 0.36→1.09 @ y 4.236의 끝 ~ 바깥 벽). 비우면 ([]) 예전처럼
    #   11-16: 가로벽 끝 y 5.60~5.70 ~ 바깥 벽 띠(RViz에서 위쪽)는 칠하지 않음 — skills.yaml no_path_zones로 옮김 (경로가 지나면 navigate 실패)
    #   11-16: 남은 두 띠(위 띠 x 4.04~ · 왼쪽 아래 띠)도 칠하지 않음 — skills.yaml no_path_zones로 옮김
    # keepout_zones: [x0, y0, x1, y1, …]   — 빈 [] 는 rcl이 못 읽어(InvalidParameterValueException) 노드가 죽음 · 안 쓸 땐 줄을 뺌 (코드 기본 = 없음)
    # 박스마다 다가갈 변 (arena 축, 박스 가운데에서 그 변 쪽 · 11-13 사용자 지정 — 빈 변은 일부러 뺌). 개수가 박스 수와 다르면 무시
    #   벽 거르기(wall_clearance)는 그대로 같이 걸림. 시도 순서 = 적은 순서 (11-14: 첫 면 = 진입 면 · 뒤는 실패할 때 대신)
    #   "+x@0.41" = 그 변은 박스 가운데에서 0.41 m(법선)에 서서 approach 시작 (지도 그림의 빨간 점에서 읽음 · 없으면 변 + standoff)
    #   11-15 사용자: 첫 면 = 그림에 찍은 approach 점 (skills.yaml via_points와 같은 자리)
    #   11-18: 면이 하나뿐이던 S2·S6 · L1에 대체 면 추가 — 막히면 돌아서 다른 면으로 (사용자). 몸이 상자까지 곧게 다가가는 통로의
    #     벽·다른 상자 여유 ≥ 3 cm인 면만 (scene 1 cm 벽 지도 계산: S2 +x 8.5 cm · S6 +x 8.5 cm · L1 -y 25.5 cm)
    start_box_sides:
      # 11-20: 다가설 자리를 줄임 (물러나는 거리도 같이 줄어듦 = @거리 − 0.1025 − approach_gap). 기준: 그 자리에서 제자리 회전
      #   (뒤 모서리 반경 0.288) + 5 cm가 벽·다른 상자에서 떨어짐 (arena_walls 선분 계산) · 0.45 아래로는 안 내림 (앞 카메라로 상자를 보는 거리, 0.44·0.45 면이 이미 됨)
      #   예전: "+x@0.81 -y@0.45", "-y@0.44 +x@0.45", "-y@0.73 +y@0.35", "-y@0.73 +y@0.57 -x@0.49", "-x@0.69 +y@0.52", "-x@0.73"
      # 11-21 사용자: S1은 -y 먼저 — +x(출발 자리 반대편)부터면 상자를 지나쳐 돌아 들어감. +x는 막혔을 때 대신
      [
        "-y@0.45 +x@0.45",
        "-y@0.44 +x@0.45",
        "-y@0.58 +y@0.35",
        "-y@0.45 +y@0.45 -x@0.49",
        "-x@0.45 +y@0.45",
        "-x@0.45",
      ]
      # ["+x -y", "-y +x", "-y +y", "-y +y -x", "-x +y", "-x"]
    #   11-18 사용자 진입점 그림: S6 +x 면은 들어갈 수 없는 곳 → 뺌 (나머지 상자·장소의 면은 그림과 같음)
    # [m] 박스마다 도킹 뒤 다가설 자리보다 더 물러남 (뒤 벽까지 몸 뒤 0.245 m + 여유 계산, 11-15) — B6: 칸 입구 밖 회전 자리까지 ·
    #   B2: 뒤가 넓음. 나머지는 첫 진입 면 뒤가 좁아 0 (B4·B5는 물러나면 뒤 벽 0.1 m 안)
    #   11-18 sim: B6 0.25 → 0 — 물러난 자리(다가설 자리 + 0.25)가 L2 받침대 6 cm 앞이라 어떤 목표로도 경로가 안 나옴(갇힘, 2회 재현)
    start_box_retreat: [0.0, 0.25, 0.0, 0.0, 0.0, 0.0]
    location_box_sides:
      ["-y@0.45", "-y@0.49 +x@0.45 +y@0.47 -x@0.43", "-y@0.67 +x@0.32 +y@0.37"]
    #   11-18: L1은 -y(map 북쪽)만 (사용자) — -x(동쪽)에서 붙고 빠져나오면 앞바퀴 축이 아래 가로벽(map y −0.33)에서 0.33 m라
    #     제자리 회전(뒤 모서리 반경 0.288)이 3~4 cm 여유로 막혀 L1 다음 구간이 매번 갇힘 (sim M7·M8). 대체 면으로도 같은 이유로 뺌
    #   장소는 적은 순서가 아니라 로봇에서 가까운 면부터 (location_side_nearest, 11-18 사용자)
    location_side_nearest: true
    wall_clearance: 0.22 # [m] 다가설 자리가 벽에서 이보다 가까우면 그 변은 안 감 (Nav2 robot_radius 0.16 + 여유)
    start_boxes: [
        1.468,
        0.950,
        3.670,
        3.152,
        2.936,
        5.354,
        0.734,
        5.354,
        2.202,
        5.354,
        3.670,
        3.886,
      ] # 시작 박스 1~6 중심
    box_half: 0.1025 # 205 박스 반 변
    puck_offsets_x: [-0.040, 0.040] # 박스 위 퍽 두 개 — 중심 X±40
    locations: [3.714, 0.965, 2.275, 3.661, 3.659, 5.289] # L1·L2·L3 격자 중심 (11-15 실측: 상자 가운데)
    location_boxes: [
        3.714,
        0.965,
        0.1025,
        2.275,
        3.661,
        0.1025,
        3.659,
        5.289,
        0.1025,
      ] # 장소가 놓인 박스 [x, y, 반 변] — 셋 다 205 박스 (11-04 운영 확인: L2 받침대도 같은 크기)
    location_tags: [12, 13, 14] # L1·L2·L3 장소 태그 번호
    tag_correction_max: 0.6 # [m] 놓기 직전 인지 location_box(상자 윗면 가운데 · depth — 태그 자리 아님)가 예상 상자 중심에서 어긋난 만큼 칸을 옮기는 최대 거리 — 넘으면 잘못 본 것으로 보고 보정 안 함
    #   11-21 실기 nav_1121_183927: 0.05 → 0.6 (arena_corr_gate와 같게). L3 인지 상자가 도면에서 9~11 cm라 보정을 버리고 도면 칸에 놓아
    #   가운데 칸이 상자 가운데에서 약 12 cm (place_off 43 mm · place_unseen · place_failed). 도킹은 인지 상자로 하는데 칸만 도면이었음
    # 도면 보정 — 경기장이 도면(위 좌표)과 100 % 같지 않고 출발 자세도 대충이라, 달리며 본 시작 박스·장소 상자(윗면 가운데)를
    #   도면 상자와 짝지어 arena → map 변환에 (dx, dy, dθ)를 더함. 다가설 자리·장소·복귀·/arena/walls 전부 (회차 시작마다 0부터)
    #   기록: 로그 "도면 보정 dx … (근거 n개)" · <회차>/arena_correction.jsonl · /arena/correction (latched JSON)
    #   영상 끝에 잘린 상자(cut)와 같은 관측의 재발행(last_seen 그대로)은 안 셈
    arena_correction: true # 상자 인지·marks 수집 활성 · box-fit은 arena_corr_boxes (11-16 사용자: 켬)
    arena_corr_idle: true # 미션이 없을 때도 보정해 /arena/correction으로 냄 (approach_loop.py --real이 그 값으로 목표를 잡음) — 미션 시작하면 0부터
    arena_corr_gate: 0.6 # [m] 인지 상자가 (지금 보정한) 도면 상자에서 이 안이고 다른 상자는 그보다 0.25 m 넘게 멀 때만 짝
    arena_corr_range: 2.5 # [m] 로봇에서 이보다 먼 상자는 안 씀 (depth 오차)
    arena_corr_min_hits: 3 # 같은 상자를 이만큼 봐야 근거로 씀 (한 프레임 오인 거름)
    arena_corr_alpha: 0.3 # 상자마다 인지 위치 지수 평균 (작을수록 천천히 — 튐 방지)
    arena_corr_min_sep: 1.0 # [m] 근거 상자끼리 이만큼 떨어져야 회전까지 맞춤 (아니면 이동만)
    arena_corr_outlier: 0.15 # [m] 맞춘 뒤 잔차가 이보다 큰 상자는 빼고 다시 (근거 3개 이상일 때)
    arena_corr_max_shift: 0.8 # [m] 이동 한계
    arena_corr_max_rot: 0.35 # [rad] 회전 한계 (20°)
    arena_corr_step_m: 0.03 # [m] 보정을 바꾸는 최소 변화 — 그 안 흔들림은 버림 (11-14 실기: 2~3 cm씩 흔들림)
    arena_corr_step_rad: 0.017 # [rad] (1°)
    # 벽 정합 — nvblox 2D 격자(원본 — /map은 도면 벽이 겹쳐 있어 안 씀)의 점유 칸을 arena_walls에 점-선 ICP로 맞춤. 앞뒤 카메라가 본
    #   벽 전부가 근거라 상자 인지 없이 회전까지. 맞으면 보정(dx, dy, dθ)은 벽으로, 상자 인지는 상자마다 위치(marks)만 — 상자 둘로 맞춘
    #   회전은 10°씩 틀림 (11-15 bag approach_1115_094224 재생). 안 맞으면(벽이 한 방향만 · 칸 부족) 예전처럼 상자로
    #   상자(7 cm)는 격자에 없음 (esdf_slice_min_height 0.08) — 벽만
    arena_corr_wall_fit: true # 기본 벽 정합 활성 — src/n/RMS 기록 및 목표 좌표에 사용. map→odom 이동은 아래 스위치가 별도 제어
    arena_corr_boxes: false # 11-18 사용자: 도면 상자 자리는 실제와 달라 추정값으로만 — 상자로 위치(map→odom) 보정 안 함 (실기 S3 보정 0.21 m가 S6에서 벽과 겹침). 11-16: 켬 (벽 정합이 한 번 맞기 전까지만 — 그 뒤엔 벽) — 상자마다 인지 위치(marks)는 계속 /arena/correction에
    arena_corr_wall_gate: 0.3 # [m] 도면 벽에서 이 안의 칸만 (그 밖 = 상자·사람·도면에 없는 것)
    arena_corr_wall_min_cells: 60 # 맞은 칸(5 cm depth 점 칸)이 이보다 적으면 안 씀 (5 cm 칸 → 벽 3 m)
    arena_corr_wall_min_eig: 0.03 # x · y · 회전이 다 묶여야 (벽 한 줄만 보이면 그 벽을 따라가는 방향을 모름)
    arena_corr_wall_period: 2.0 # [s] 다시 맞추는 주기
    arena_corr_wall_keep_s: 25.0 # [s] 이만큼 최근에 본 depth 점 칸만 (odom이 서서히 틀어지니 짧게 · 11-20)
    arena_corr_wall_z_min: 0.10 # [m] odom 높이 띠 — 상자(7 cm)·퍽은 빼고 벽만
    arena_corr_wall_z_max: 0.30
    arena_corr_walls_m:
      0.0 # [m] /arena/walls(도면 벽)를 다시 보내는 최소 변화 — 보낼 때마다 Nav2 costmap이 다시 잡힘 · 0 = 안 보냄
      #   11-15: 0.15 → 0 — 전역 경로가 /arena/walls를 봄. 상자 하나(근거 1개)로 dy −0.2 m 보정이 벽까지 옮겨 문이 실제보다 위로 →
      #   경로가 위쪽 벽 끝으로 치우쳐 막힘. 벽은 실측·고정이라 안 옮김 (보정은 상자 목표에만)
    arena_corr_walls_rad: 0.087 # [rad] (5°)
    # 보정 → 로봇 위치 (11-15): 근거가 충분한 보정을 목표에만 얹지 않고 로봇 위치(map→odom)로 넘김 — 벽·문·costmap·nvblox·목표가 한 좌표
    #   cuvslam_slam이 /localization/map_correction을 받아 map 기준을 옮김 (MapGate 초당 5 cm·5°로 부드럽게)
    #   11-15 밤 끔: 시뮬에서 정지한 로봇 위치가 2분 동안 60번 5 cm씩 밀려 7 m까지 흘러감 — '남은 보정'이 0으로 안 줄고(+0.07~0.12 m)
    #   같은 방향으로 계속 (위치를 옮기면 nvblox 지도도 따라 옮겨져 벽 정합이 같은 차이를 다시 봄 · 시뮬 벽은 plan 벽과 ≤11 cm 다름).
    #   실기 녹화 중 map 1~4 m 튐(day1_03~06)도 같은 원인으로 보임. 고치기 전까지 false
    #   11-16: 넘긴 몫(loc_sent_)을 벽 정합 차이에서 빼 같은 차이를 다시 넘기지 않게 고침
    #   11-19 실기 다시 끔 (bag nav_1119_172047): loc_sent_ 뒤에도 같은 방향(dθ −0.5~−1.5°)을 2 s마다 다시 넘겨 28 s 만에 map→odom +5.3°·19 cm 누적
    #   → 도면 벽(/arena/walls · walls_cloud)과 카메라가 본 실제 벽이 두 줄 → S4 접근 nav_no_progress 3번. 벽 정합은 기록·목표 계산만
    #   11-20 절대값으로 다시 켬: wall_localization이 odom 좌표 depth 점(최근 arena_corr_wall_keep_s)을 벽에 맞춘 결과를 map→odom 목표로
    #   (/localization/map_to_odom) — 조각을 더하지 않아 잠금·지연에도 안 쌓임 (시뮬 11-20: 증분은 −1°를 98번). BEE_MAP_ANCHOR=odom일 때만 받음
    #   mission_manager는 arena_corr_wall_fit이 켜져 있으면 상자로는 안 옮김 (loc_tick 안 돎)
    #   11-21 Isaac 전체 미션(실기와 같은 Cyclone · odom 기준, 26분)으로 true 확정: 위치 오차 평균 1.5 cm · p95 3.7 cm
    #   (odom만은 최대 47 cm 밀림 — 벽 정합이 되돌림). false로 둔 같은 판은 도킹 중 바퀴 헛돎 뒤 위치 오차 41 cm가 남아
    #   box 3 · 복귀 nav_no_progress로 미션 실패. 11-20의 −6.7° 틀어짐은 재현 안 됨 (map→odom yaw 0→+4°는 실제 odom drift를 따라감)
    # !! 절대 false로 바꾸지 말 것 — 틀어짐이 보이면 끄지 말고 bag · GT 비교로 원인을 먼저 찾는다 (끄면 odom drift가 그대로 남음)
    arena_corr_to_localization: true # 절대 바꾸지 말 것 (11-21 · 위 주석)
    arena_corr_loc_min_n: 3 # 상자 근거 이만큼(또는 벽 정합)일 때만 — 상자 1~2개로는 안 옮김
    arena_corr_loc_step_m: 0.05 # [m] 한 번에 넘기는 조각 (MapGate 잠금 0.30 m보다 훨씬 작게)
    arena_corr_loc_step_rad: 0.0175 # [rad] (1°)
    arena_corr_loc_min_m: 0.02 # [m] 남은 보정이 이보다 작으면 안 넘김
    arena_corr_loc_min_rad: 0.0035 # [rad] (0.2°) — 11-18: 0.5° → 0.2° (4 m 앞 1.4 cm · 0.5°면 3.5 cm가 남음)
    arena_corr_loc_period: 2.0 # [s] 조각 사이 간격
    arena_corr_loc_settle_s: 1.5 # [s] 넘긴 뒤 이만큼은 상자 관측을 안 셈 (좌표가 옮겨지는 중)
    # 적재함: 장부(칸 → tag)는 coordinator가 씀 (/coordinator/basket) — 쓰는 칸은 coordinator basket_use. 다 차면 나머지는 not_loaded (직접 운반 안 함)
    box_top_z: 0.070 # 박스 윗면 = 퍽 바닥
    puck_height: 0.060
    grid_step: 0.060 # 주사위 칸 간격
    standoff: 0.25 # [m] Nav2로 박스 변 바깥 이만큼까지 (로봇을 원 0.18로 보므로 더는 못 붙음)
    approach_perceived:
      true # 다가설 자리(start/location_box_sides) · Nav2 목표의 박스 가운데 = 이번 회차에 본 인지 상자 평균
      #   (arena_corr_min_hits번 넘게 · 도면 가운데에서 arena_corr_gate 안일 때) — 아니면 도면. 변 · @거리 · standoff는 그대로 (11-16)
      #   arena_correction을 꺼도 상자 인지 위치(marks)는 셈. 로그 "S3 다가설 자리 — 인지 상자 가운데 (도면에서 …)"
    nav_turn_m: 0.10 # [m] Nav2 목표는 박스 가운데에서 이만큼까지 법선으로 물림 (몸 외접 0.30 m가 박스에 안 걸리고 제자리 회전 · 벽 쪽으로는 덜) — 나머지는 approach가 직선으로 (11-14)
    # 테스트를 위해서 좀더 큰 변화 테스트 20261119 변경
    # 기록을 위해서 여기에 남김
    approach_gap:
      0.144 # [m] 그다음 approach로 base_footprint ~ 박스 변을 이만큼까지 (로봇 앞면 0.069 → 7.5 cm) — 11-20 실기: 5 cm도 바짝 붙음
      #   11-20: 시뮬에서는 먼 줄 퍽(0.287 m > pick_far 0.285)이 안 닿았음 — 실기에서 먼 퍽 pick 확인. 안 되면 0.13(6 cm)
    # 도킹 뒤 퍽이 멀면 팔이 닿게 조금 전진 (pick_near, 11-20) — 로봇 중심 ~ 퍽이 pick_reach_m 안에 들 만큼만 · 상자 앞 gap creep_min_gap까지
    pick_reach_m: 0.25 # [m] 수직 pick 한계 약 0.256 (시뮬 팔 범위) − 여유
    # 차체에 붙은 퍽 (11-21 사용자): 상자 위 퍽이 로봇 앞 inspect_back_min_x 안이거나 tag를 못 읽으면 look 자세로 곧게 물러나 다시 inspect
    #   (두 번까지) — 실기 nav_1121_183927: 0.13~0.15 m 퍽은 tag 못 읽음/안 보임 · 0.20~0.25 m는 다 읽음
    inspect_back_min_x: 0.17 # [m]
    inspect_back_want_x: 0.21 # [m] 가장 붙은 퍽이 이만큼 앞에 오게 물러남
    inspect_back_max_m: 0.08 # [m] 한 도킹에서 물러나는 최대 (exit 거리에서 그만큼 뺌)
    creep_min_gap:
      0.095 # [m] 전진해도 base_footprint ~ 상자 변이 이 아래로는 안 감 (앞면 2.6 cm — 11-20 오전까지 쓰던 도킹 거리)
      #   11-20: 0.085 → 0.095 (+1 cm) — 도킹 때 가끔 상자를 밀고 더 들어감(상자 위치 추정이 멀게 잡히면 마지막 10 cm는 odom만 보고 감) → 1 cm 여유
      #   Isaac 도달 지도(dice_reach.py): 0.08이면 3×3 칸 9개 다 닿음 · 0.10이면 먼 줄 양끝 못 닿음
    approach_tries: 3 # 접근 자리 실패 시 다른 변으로 몇 번까지
    retries: 2 # skill(집기·놓기·inspect)이 실패하면 다시 하는 횟수. 그래도 안 되면 그 퍽만 실패로 두고 다음 (집기 = 1 + retries번, 다시 할 때마다 inspect로 봄)
    # SURVEY (11-21 사용자): 시작 박스의 퍽을 다 실어야 다음 상자 · 들고 다니지 않음 · 못 실은 퍽은 BUILD(place) 전에 그 상자에 한 번 더 옴
    survey_load_tries: 3 # 퍽 하나 load 시도 수 — 실패하면 상자 빈 자리에 되돌리고 inspect → pick → load
    put_back_x_m: 0.21 # [m] 되돌릴 자리: 로봇 앞 이만큼 (상자 윗면 안으로 당김) — 상자 가운데(약 0.25 m)는 pick 한계에 걸림 · tag는 0.20~0.25 m에서 잘 읽힘 (11-21 실기)
    put_back_ring_m: 0.05 # [m] 그 자리에 다른 퍽이 가까우면 옆 · 조금 앞으로 이만큼씩 옮긴 곳 중 빈 곳
    put_back_clear_m: 0.065 # [m] 빈 곳 = 다른 퍽 중심에서 이만큼 넘게 (11-21 실기 S2: 5 cm에 되돌린 퍽 9에 퍽 0 pick이 얹혀 막힘)
    planner: "rule" # BUILD 순서: rule (배정 순서대로) | plan_next (학습된 플래너가 다음 퍽·복귀 시점을 고름 — 마지막 단계)
    plan_model: "" # 비면 share/ml/model/plan/plan_next.onnx (.policy 경로를 주면 MlpPolicy로)
    place_tol: 0.010 # [m] 놓은 뒤 확인 · 재검증 — 칸 중심에서 이 안이어야 성공
    place_search: 0.05 # [m] 놓은 뒤 확인 때 칸에서 이 안의 퍽만 그 퍽으로 봄
    match_radius: 0.04 # [m] 조사 때 퍽 자리와 트랙을 짝짓는 거리
    stand_check_s: 1.0 # [s] 누운 퍽 stand 뒤 인지가 섰는지 볼 때까지 기다림 → 섰으면 선 퍽을 pick (못 보면 stand_pick), 아직 누웠으면 stand 다시 (retries번)
    stand_find_m: 0.10 # [m] stand 뒤 look에서 누운 가운데 이 안의 퍽: 누움 → 다시 stand · 섬 → pick · 없음 → stand_lost (선 퍽은 약 45 mm 옆 · 실패하면 6~7 cm 튐) — 11-15
    verify_radius: 0.15 # [m] 재검증 때 장소 중심에서 이 안의 퍽만
    verify_in_place: true # 장소의 마지막 퍽을 놓은 그 자리에서 바로 재검증 (11-15) — false면 다 놓은 뒤 L3·L2·L1을 다시 찾아감
    # 바코드 보는 자세 [x, y, yaw] (출발 구역 안) — 비우면 출발(관측) 자리에서 그대로 봄 (이동 없음)
    #   실기 11-12: 출발 자리에서 신호등·바코드 둘 다 인지됨 → 이동 안 함. 예전 시뮬 값 [0.950, 0.800, 3.3126]은
    #   26 cm 뒤 자리라 Nav2가 돌아섰다 다시 돌아 한 바퀴를 돌았음 (시뮬 렌더에선 바코드가 화면 끝에 걸렸음)
    #   옮겨서 보려면 아래 줄을 살림 (빈 배열 []은 ROS YAML이 타입을 몰라 못 씀 — 줄을 빼면 코드 기본 = 이동 없음)
    # barcode_pose_arena: [0.950, 0.800, 3.3126]
    barcode_timeout_s: 20.0 # [s] 후보/gaze를 시작할 수 없거나 마지막 자리에서 이만큼 안 읽히면 오류 (신호 대기 시간은 제외)
    barcode_gaze_wait_s: 3.0 # [s] gaze 도착(또는 한 걸음 다가간 뒤) 이만큼 안 읽히면 한 걸음 더
    barcode_advance_step_m: 0.06 # [m] 한 걸음 (팔은 gaze 그대로 · approach drive_straight) — 읽힐 때까지 계속
    barcode_min_gap_m: 0.13 # [m] 손 카메라 정면(depth)이 이보다 가까우면 더 안 다가감 — 손끝이 벽에 안 닿게 (depth 모르면 안 다가감)
    barcode_advance_max_m: 0.30 # [m] 최대 다가가는 거리 (안전 상한 — 반투명 벽은 depth가 판 너머를 잴 수 있음) — 끝나면 팔 접고 그만큼 똑바로 후진
    barcode_pole_s: 3.0 # [s] pole_front_cam이 신호를 우선 관측할 시간 — 이후에는 바코드 막대 후보만 계속 추적
    barcode_arm_pose: gaze # 후보 위치로 수평 방향을 맞춰 gripper_cam으로 읽고 stow로 돌아옴 ("" = 팔 이동 안 함)
    barcode_gaze_after_signal: false # 후보 위치가 잡히면 신호 확정과 병렬로 target-aligned gaze. true면 신호부터 확정
    barcode_peek: true # 바코드 후보가 잡히면 먼저 "엿보기": 팔은 stow로 접은 채 손목(joint4)·방위(joint1)만 바코드로 + 손 카메라 컬러를 잠깐 고해상도로 (11-20)
    #   뻗지 않아 joint2 과부하 없음 · 다가가지 않아 신호등이 pole 시야에 남음 · 신호 확정을 안 기다림. 못 읽으면 해상도 되돌리고 아래 gaze 흐름 그대로
    barcode_peek_s: 4.0 # [s] 고해상도 영상이 들어온 뒤 이만큼 안 읽히면 gaze로 (15 fps면 약 60장 — perception이 처리하는 만큼)
    barcode_peek_switch_s: 5.0 # [s] 손목 도착 뒤 이만큼 고해상도 영상이 안 오면(파라미터 서비스 없음·전환 실패) gaze로
    barcode_peek_profile: "1920x1080x15" # 엿보기 동안만 쓰는 손 카메라 컬러 프로파일 (D435 1080p · realsense-ros 4.57 실행 중 변경)
    barcode_cam_profile: "640x360x15" # 엿보기 뒤 되돌릴 프로파일 — bringup gripper_cam_profile과 같게
    barcode_peek_cam: /gripper_cam # 손 카메라 realsense2_camera 노드 이름
    barcode_height_m: 0.15 # [m] 바코드 중심 높이 — 인지한 높이가 0.03~0.8 m 밖일 때만 씀 (11-12 gaze 화면 가운데 기준 추정)
    arm_sag_rad: 0.25 # [rad] gaze 유지 중 관절이 도착 값에서 이만큼 넘게 벗어나면 팔 처짐으로 보고 정지 (0 = 끔)
    motor_error_stop: true # OpenCR 모터 에러(과부하 등) 진단이 뜨면 미션 바로 정지 (motor_error: … — ~/reboot_motors 뒤 다시)
    signal_timeout_s: 150.0 # [s] 관측(BARCODE) 시작부터 신호 확정까지 — 바코드와 같이 봄 (한 사이클 약 27초 · 12개 한 번이면 확정)
    signal_read_min_s: 60.0 # [s] 바코드에 시간을 다 써도 READ에 들어온 뒤 최소 이만큼은 신호를 봄
    light_check_s: 8.0 # [s] 관측 시작 뒤 이만큼 pole_front_cam에 신호등이 안 보이면 경고 (방향·팔 가림)
    signal_error_cycles: 2 # 오류 사이클(count·unknown·range)이 이만큼 이어지면 ERROR — 한 번은 잡음일 수 있어 다음 사이클을 봄
    home_hold_s: 3.0 # [s] 출발 구역에서 정지 (발제: 3초)
    # 현장 진단 실행 (실기 시험용) — true면 관측(바코드·신호) 실패도 기록만 하고 다음 단계로, 끝에 실패 목록 + RETURN.
    #   치명 이유(estop·manual·arm_contact·collision·overcurrent·abort… — mission_solver.hpp diag_fatal)면 지금처럼 바로 정지.
    #   기본 false = 대회 규칙대로 (관측 실패 = 안전 정지). TUI 미션 메뉴 'x' 또는 /cmd/mission "start:DIAG"는 그 회차만 켬
    continue_on_fail: false
    diag_stuck_limit: 3 # 진단 실행에서 주행 갇힘(nav_no_progress · nav_failed)이 이만큼 이어지면 치명으로 정지
    log_dir: "~/.ros/mission" # 회차별 signal · allocation · build · verify · return (· error) .json + photos/
    photo_topic: "/gripper_cam/color/image_raw" # 단계 사진 (찍을 때만 잠깐 구독) — 빈 문자열이면 안 찍음
