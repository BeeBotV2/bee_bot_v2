# Nav2 파라미터 — 주행 구조 (2026-11-18 재설계, isaac/mission/nav_bench.py 시뮬 측정 기준)
#
# 속도 체인: controller_server·behavior_server → /cmd_vel_nav → twist_mux → /cmd_vel_mux → velocity_smoother
#   → /cmd_vel_smoothed → collision_monitor → /cmd_vel (리매핑은 ros_system.launch.py)
# 프레임: base_footprint (= 앞 바퀴축, 몸은 뒤로 0.245 m) · odom = EKF /odometry/filtered
#
# 구조 원칙
#   1. 전역 경로가 몸 모양을 본다 — SmacPlannerLattice(차동 구동 운동 단위 + 제자리 회전)가 직사각형 footprint로 충돌 검사.
#      예전 SmacPlanner2D는 앞 바퀴축 점(원 0.15)만 봐서, 경로를 정확히 따라가도 뒤 꼬리가 벽을 긁었다.
#   2. 컨트롤러는 그 경로를 몸 모양 그대로 따라간다 — MPPI(직사각형 footprint 비용) 하나. RL 래퍼·문 경유점·가르친 경로 없음.
#   3. 한계는 실기 측정값 — 지연 ≈ 0.10 s, 0→0.17 m/s 90 % 약 0.3 s (bag nav_1116_062046). 가속 2.5 m/s²는 실기가 못 냄.
#   4. 막히면 빨리 안다 — progress_checker 0.10 m / 4 s → BT 복구 → skill_navigate 진척 감시 → mission이 다른 면으로.
#
# 로봇 몸 (beebot.usda 충돌 도형, faker/config/robot_footprint.yaml): 앞 0.069 · 뒤 −0.245 · 옆 ±0.151 [m]
#   외접 반경(뒤 모서리) 0.288 — inflation_radius는 이보다 커야 costmap이 몸 모양 충돌 검사를 한다.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    transform_tolerance: 0.5
    bt_loop_duration: 10
    default_server_timeout: 100
    wait_for_service_timeout: 10000   # 기동 직후 부하로 1 s 안에 서버가 안 보이면 활성화 실패했음 (실측)
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # BT 파일(config/navigate_to_pose.xml · navigate_through_poses.xml)은 ros_system.launch.py가 넘긴다.

# ─────────────────────────────────────────────────────────────────────────────
# controller_server — 경로 추종 (출력 /cmd_vel_nav)
# ─────────────────────────────────────────────────────────────────────────────
controller_server:
  ros__parameters:
    transform_tolerance: 0.5
    controller_frequency: 20.0
    odom_topic: /odometry/filtered
    speed_limit_topic: /speed_limit
    enable_stamped_cmd_vel: true   # Lyrical diff_drive_controller · twist_mux가 TwistStamped만 받음
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # 컨트롤러가 앞 충돌로 멈춰도 이 시간(s)까지는 실패로 안 침 — 그사이 BT(2 Hz)가 막힌 경로를 보고 돌아갈 길을 내려줌.
    #   0.3이면 새 경로가 오기 전에 실패 → 복구가 costmap을 비워 장애물을 잊고 다시 들이받는 되풀이 (nav_bench 11-18)
    failure_tolerance: 2.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker", "general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # 막힘 판단 — 4 s 동안 0.10 m도 못 가면 FollowPath 실패 → BT 복구. 제자리 회전도 진척으로 친다(PoseProgressChecker).
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.10
      required_movement_angle: 0.35
      movement_time_allowance: 4.0

    # 단일 목표 — 상자 앞 다가설 자리. 마지막 몇 cm·방향은 approach skill이 상자를 보며 맞춘다.
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.3
    # through-poses BT가 찾는 이름 — 통과 지점이라 넓게
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.5

    # RotationShim + RPP — Lattice 경로가 이미 몸이 지나갈 수 있는 길이라, 그 경로를 정확히 따라가는 추종기.
    #   경로 방향과 0.6 rad 넘게 틀어져 있으면 먼저 제자리 회전(shim, 충돌 검사), 그 뒤 RPP가 앞쪽 점(lookahead)을 쫓는다.
    #   곡률이 크면 속도를 줄여(regulated) 바깥 바퀴가 한계(0.26 m/s)를 넘지 않게. 앞길에 충돌이 보이면 멈춤 → BT가 재계획.
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      angular_dist_threshold: 0.6
      angular_disengage_threshold: 0.2
      forward_sampling_distance: 0.4
      rotate_to_heading_angular_vel: 1.2
      max_angular_accel: 2.5
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      rotate_to_heading_once: false
      primary_controller:
        plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
        max_linear_vel: 0.26
        lookahead_dist: 0.30
        min_lookahead_dist: 0.20   # 짧을수록 경로에 붙음 — 길면 문을 비스듬히 지날 때 carrot까지의 호가 모서리를 잘라 '앞 충돌'로 멈춤
        max_lookahead_dist: 0.5
        lookahead_time: 1.0
        use_velocity_scaled_lookahead_dist: true
        rotate_to_heading_angular_vel: 1.2
        use_rotate_to_heading: false
        allow_reversing: false
        max_angular_accel: 2.5
        use_regulated_linear_velocity_scaling: true
        regulated_linear_scaling_min_radius: 0.9
        regulated_linear_scaling_min_speed: 0.08
        use_cost_regulated_linear_velocity_scaling: true
        cost_scaling_dist: 0.25
        cost_scaling_gain: 1.0
        inflation_cost_scaling_factor: 10.0   # = local_costmap inflation cost_scaling_factor
        use_collision_detection: true
        max_allowed_time_to_collision_up_to_carrot: 0.5
        approach_velocity_scaling_dist: 0.4
        min_approach_linear_velocity: 0.05
        interpolate_curvature_after_goal: false
        use_fixed_curvature_lookahead: false
        stateful: true

# ─────────────────────────────────────────────────────────────────────────────
# planner_server — 전역 경로(/plan). Lattice: 차동 구동 운동 단위(직진·호·제자리 회전)를 이어 붙이며
#   매 칸 직사각형 footprint로 충돌을 본다 → 경로 자체가 이 몸으로 지나갈 수 있는 길.
#   이름 GridBased = BT가 부르는 planner_id
# ─────────────────────────────────────────────────────────────────────────────
planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      lattice_filepath: "/opt/ros/lyrical/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json"
      allow_unknown: true
      tolerance: 0.10
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 1.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 0.6
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.05
      cost_penalty: 3.5        # 벽 가까운 칸을 비싸게 → 문·통로 가운데로 (2.0이면 문 모서리에 붙은 경로)
      rotation_penalty: 3.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      allow_reverse_expansion: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

# ─────────────────────────────────────────────────────────────────────────────
# behavior_server — BT 복구 (Spin · BackUp · Wait). 출력 /cmd_vel_nav
# ─────────────────────────────────────────────────────────────────────────────
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 1.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.3
    rotational_acc_lim: 2.5
    enable_stamped_cmd_vel: true

# ─────────────────────────────────────────────────────────────────────────────
# local_costmap — 로봇 주변 3×3 m (odom, 굴러감). 정적 벽(/arena/walls) + 카메라 voxel(상자·동적 장애물) + 팽창
#   카메라는 앞·아래만 본다 → 옆·뒤는 정적 벽에 기댄다.
# ─────────────────────────────────────────────────────────────────────────────
local_costmap:
  local_costmap:
    ros__parameters:
      initial_transform_timeout: 300.0   # 기동 부하로 odom TF가 늦어도 Nav2 전체가 안 멈추게
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      always_send_full_costmap: true
      footprint: "[[0.069, 0.151], [0.069, -0.151], [-0.245, -0.151], [-0.245, 0.151]]"
      footprint_padding: 0.0    # 실제 몸 — 전역(0.02)보다 작게: 같거나 크면 전역이 2 cm 여유로 낸 경로를 RPP가 carrot 호 검사에서 "앞 충돌"로 멈추고
                                #   전역은 길이 멀쩡하다 해 재계획도 안 함 (교착, nav_bench·drive_test 11-18). 마지막 안전은 collision_monitor 몸 +2 cm
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /arena/walls   # mission_manager: plan.yaml 실측 벽 + 상자 (경기장 보정은 로봇 위치로 들어감)
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 0.6
        mark_threshold: 0
        observation_sources: pole_front_cam
        pole_front_cam:
          topic: /pole_front_cam/depth/color/points_filtered   # perception body_filter가 자기 몸 점을 뺀 것
          data_type: "PointCloud2"
          min_obstacle_height: 0.06
          max_obstacle_height: 0.6
          marking: true
          clearing: true
          obstacle_min_range: 0.0
          obstacle_max_range: 1.5
          raytrace_min_range: 0.0
          raytrace_max_range: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35   # ≥ 외접 0.288 + padding
        cost_scaling_factor: 10.0

# ─────────────────────────────────────────────────────────────────────────────
# global_costmap — 경기장 전체. 정적 벽 + 카메라 장애물(경로를 막은 상자·사람을 돌아가는 재계획용) + 팽창
# ─────────────────────────────────────────────────────────────────────────────
global_costmap:
  global_costmap:
    ros__parameters:
      initial_transform_timeout: 300.0
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[[0.069, 0.151], [0.069, -0.151], [-0.245, -0.151], [-0.245, 0.151]]"
      footprint_padding: 0.02   # 0.04면 상자 앞 좁은 목표(S5·L2)로 가는 경로가 안 나옴 (nav_bench 11-18)
      resolution: 0.05
      track_unknown_space: false   # /arena/walls는 벽·상자 말고 −1 — 빈칸으로 읽음
      always_send_full_costmap: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /arena/walls
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: pole_front_cam
        pole_front_cam:
          topic: /pole_front_cam/depth/color/points_filtered
          data_type: "PointCloud2"
          min_obstacle_height: 0.06
          max_obstacle_height: 0.6
          marking: true
          clearing: true
          obstacle_min_range: 0.0
          obstacle_max_range: 1.2
          raytrace_min_range: 0.0
          raytrace_max_range: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45   # ≥ 외접 반경 — Lattice가 몸 모양 검사를 하려면 필요. 바깥쪽은 통로 가운데로 끄는 비용
        cost_scaling_factor: 8.0

# ─────────────────────────────────────────────────────────────────────────────
# velocity_smoother — /cmd_vel_mux → /cmd_vel_smoothed. 한계 = 실기
# ─────────────────────────────────────────────────────────────────────────────
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.26, 0.0, 1.82]
    min_velocity: [-0.26, 0.0, -1.82]
    max_accel: [1.0, 0.0, 2.5]
    max_decel: [-1.5, 0.0, -3.0]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: true

# ─────────────────────────────────────────────────────────────────────────────
# collision_monitor — 마지막 안전장치: /cmd_vel_smoothed → /cmd_vel
#   Approach: 지금 명령으로 time_before_collision 동안 움직였을 때 몸 사각형(+2 cm)이 점에 닿으면 그 전에 멈추도록 감속.
#   source: 앞 카메라 점(동적 장애물·상자) + /arena/walls_cloud(도면 벽, 카메라가 못 보는 옆·뒤)
# ─────────────────────────────────────────────────────────────────────────────
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: false   # true면 /cmd_vel이 0.15~0.54 s 늦어 diff_drive가 명령을 버렸음 (11-14)
    stop_pub_timeout: 2.0
    enable_stamped_cmd_vel: true
    polygons: ["Approach"]
    Approach:
      type: "polygon"
      action_type: "approach"
      points: "[[0.089, 0.171], [0.089, -0.171], [-0.265, -0.171], [-0.265, 0.171]]"
      time_before_collision: 0.8
      simulation_time_step: 0.05
      min_points: 3
      visualize: true
      polygon_pub_topic: polygon_approach
      enabled: true
      holonomic: false
    observation_sources: ["pole_front_cam", "arena_walls"]
    arena_walls:
      type: "pointcloud"
      topic: /arena/walls_cloud
      min_height: 0.05
      max_height: 0.6
      enabled: true
    pole_front_cam:
      type: "pointcloud"
      topic: /pole_front_cam/depth/color/points_filtered
      min_height: 0.05
      max_height: 0.6
      enabled: true

# ─────────────────────────────────────────────────────────────────────────────
# lifecycle 관리자 — base(바퀴 명령 체인, odom만 있으면 뜸) · navigation(지도 필요)
# ─────────────────────────────────────────────────────────────────────────────
lifecycle_manager_base:
  ros__parameters:
    autostart: true
    bond_timeout: 60.0
    node_names: ["velocity_smoother", "collision_monitor"]

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    bond_timeout: 60.0
    node_names: ["planner_server", "controller_server", "behavior_server", "bt_navigator"]
